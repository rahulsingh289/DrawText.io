<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Tile -->
  <rect width="100" height="100" rx="28" fill="#0d111d" stroke="#252c42" stroke-width="2"/>
  
  <!-- Flowing Infinity / Pen Stroke Shape -->
  <path d="M 28 50 C 28 36, 42 34, 50 48 C 58 62, 72 64, 72 50 C 72 36, 58 36, 50 50 C 42 64, 28 64, 28 50 Z" 
        stroke="url(#flowGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Pen Nib Sparkle Accent -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="72" cy="50" r="3" fill="#ec4899"/>
  <circle cx="28" cy="50" r="3" fill="#6366f1"/>
</svg>